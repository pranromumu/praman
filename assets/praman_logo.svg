
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <rect id="block" x="0" y="0" width="360" height="360" rx="48" ry="48"/>
    <mask id="checkCutout">
      <rect x="-200" y="-200" width="900" height="900" fill="black"/>
      <path
        d="M 60 190
           L 140 270
           L 300 70"
        fill="none"
        stroke="white"
        stroke-width="58"
